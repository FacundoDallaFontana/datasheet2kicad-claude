[project]
name = "dsgen"
version = "0.1.0"
description = "Generates KiCad .kicad_sym and .kicad_mod files from a datasheet PDF using Claude Code"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "kipart>=2.8",
    "pydantic>=2",
    "pymupdf",
    "pyyaml",
    # kicad-footprint-generator (KicadModTree + IPC generators) is installed from vendor/,
    # see setup.ps1
]

[project.scripts]
dsgen = "dsgen.__main__:main"

[tool.setuptools]
packages = ["dsgen", "dsgen.families"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not ai\""
markers = ["ai: end-to-end tests on real datasheets in pdf-test/ (they call Claude)"]
